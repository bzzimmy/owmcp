name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm run build

  luau:
    runs-on: ubuntu-latest
    env:
      LUAU_LSP_VERSION: 1.70.0
    steps:
      - uses: actions/checkout@v4
      - name: Install luau-lsp
        run: |
          curl -fsSL -o luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          unzip -q luau-lsp.zip -d "$RUNNER_TEMP/luau-lsp"
          chmod +x "$RUNNER_TEMP/luau-lsp/luau-lsp"
          echo "LUAU_LSP=$RUNNER_TEMP/luau-lsp/luau-lsp" >> "$GITHUB_ENV"
      - run: sh scripts/lint-lua.sh
